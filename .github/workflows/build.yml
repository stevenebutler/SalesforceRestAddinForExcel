name: Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (net48 + pack XLL)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      FC_CONFIGURATION: Release
      FC_GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Core, Windows.Ui, ExcelDna (pack)
        run: ./scripts/dev-container.sh build

      - name: Upload packed XLLs
        uses: actions/upload-artifact@v4
        with:
          name: SalesforceRestAddin-xll-${{ github.sha }}
          path: |
            src/SalesforceRestAddin.ExcelDna/bin/Release/net48/publish/*-packed.xll
          if-no-files-found: error
          retention-days: 14
